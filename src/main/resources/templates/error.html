<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error &mdash; Student Management System</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F6F8FC;
            padding: 24px;
        }
        .error-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 48px;
            max-width: 540px;
            width: 100%;
            text-align: center;
        }
        .error-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin-bottom: 24px;
        }
        .error-title {
            font-size: 26px;
            font-weight: 800;
            color: #172554;
            margin-bottom: 12px;
        }
        .error-message {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .error-details {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #475569;
            text-align: left;
            margin-bottom: 28px;
            word-break: break-word;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-exclamation-octagon"></i>
        </div>
        <h1 class="error-title">Oops! Something went wrong</h1>
        <p class="error-message">
            We encountered an unexpected issue while processing your request. Don't worry, your data is safe.
        </p>
        
        <div class="error-details" th:if="${errorMessage != null or message != null or status != null}">
            <div th:if="${status != null}"><strong>Status:</strong> <span th:text="${status}">500</span></div>
            <div th:if="${error != null}"><strong>Error:</strong> <span th:text="${error}">Internal Server Error</span></div>
            <div th:if="${errorMessage != null}"><strong>Message:</strong> <span th:text="${errorMessage}">Details</span></div>
            <div th:if="${message != null and errorMessage == null}"><strong>Message:</strong> <span th:text="${message}">Details</span></div>
        </div>

        <div class="error-actions">
            <a th:href="@{/dashboard}" class="btn-primary-sms" style="text-decoration: none;">
                <i class="bi bi-house-door"></i> Back to Dashboard
            </a>
            <a th:href="@{/students}" class="btn-outline-sms" style="text-decoration: none;">
                <i class="bi bi-people"></i> Student Directory
            </a>
        </div>
    </div>
</div>
</body>
</html>
