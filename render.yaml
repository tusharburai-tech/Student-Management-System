services:
  - type: web
    name: sms-student-management
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx384m"
