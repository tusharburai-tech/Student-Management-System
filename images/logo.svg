<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M60 8 C88 8 104 22 104 48 C104 82 60 110 60 110 C60 110 16 82 16 48 C16 22 32 8 60 8 Z" 
        fill="url(#shieldGrad)" filter="url(#dropShadow)" stroke="#FFFFFF" stroke-width="2"/>
        
  <!-- Inner Border -->
  <path d="M60 16 C82 16 96 28 96 50 C96 78 60 102 60 102 C60 102 24 78 24 50 C24 28 38 16 60 16 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85"/>
        
  <!-- Graduation Cap (Mortarboard) -->
  <polygon points="60,32 86,44 60,56 34,44" fill="url(#goldGrad)"/>
  <polygon points="60,56 78,48 78,56 60,64 42,56 42,48" fill="#F59E0B"/>
  <line x1="78" y1="48" x2="84" y2="60" stroke="#FCD34D" stroke-width="2"/>
  <circle cx="84" cy="62" r="2.5" fill="#FCD34D"/>

  <!-- Open Book at bottom of shield -->
  <path d="M60 76 C52 72 40 73 34 76 L34 90 C40 87 52 86 60 90 C68 86 80 87 86 90 L86 76 C80 73 68 72 60 76 Z" 
        fill="#FFFFFF" opacity="0.95"/>
  <line x1="60" y1="76" x2="60" y2="90" stroke="#CBD5E1" stroke-width="1.5"/>
</svg>
